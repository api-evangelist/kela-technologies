name: Kela Technologies
description: 'Kela Technologies (kela.io) is a defense technology company founded by veterans
  of elite Israeli intelligence units, providing a secure, open platform that enables rapid
  and seamless integration of commercial and military systems in service of Western defense.
  The company emerged from stealth in 2025 after raising $39M from Sequoia Capital, Lux Capital,
  and In-Q-Tel (the CIA''s venture arm). Kela is building "Sovereign Sky," a low-Earth-orbit
  satellite constellation for resilient communication and navigation independent of foreign
  infrastructure, and acquired cloud-management company Pelanor. As of this enrichment pass
  the company publishes a single-page marketing site with a privacy policy but no public API,
  developer portal, documentation, or machine-readable interface.'
